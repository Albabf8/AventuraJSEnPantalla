<!DOCTYPE html>
<html lang=es>

<head>
  <meta charset=UTF-8>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <link rel=stylesheet href=style.css>
  <script type=module src=main.js defer></script>
  <title>Aventura en el Reino JS</title>
</head>

<body>
  <main>

    <!-- ESCENA 1: JUGADOR -->
    <div id="player" class="scene">
      <button>Continuar</button>
    </div>

    <!-- ESCENA 2: MERCADO -->
    <div id="market" class="scene">
      <div id="market-container">
      </div>
      <button>Comprar</button>
    </div>

    <!-- ESCENA 3: JUGADOR ACTUALIZADO-->
    <div id="player" class="scene">
      <button>Continuar</button>
    </div>

    <!-- ESCENA 4: ENEMIGOS -->
    <div id="enemies" class="scene">
      <div id="enemies-container">
      </div>
      <button>Continuar</button>
    </div>

    <!-- ESCENA 5: BATALLA -->
    <div id="battle" class="scene">
      <div id="battle-container">
      </div>
      <button>Continuar</button>
    </div>

    <!-- ESCENA 6: RANKING -->
    <div id="ranking" class="scene">
      <div id="ranking-container">
      </div>
      <button>Continuar</button>
    </div>

  </main>
</body>

</html>

<!DOCTYPE html>
<html lang=es>

<head>
  <meta charset=UTF-8>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <link rel=stylesheet href=style.css>
  <script type=module src=main.js defer></script>
  <title>Aventura en el Reino JS</title>
</head>

<body>
  <main>

    <!-- ESCENA 1: JUGADOR -->
    <div id="scene-1" class="scene">
      <div id="scene-1-container">
        <div class="row-1">
          <div class="img-container">
            <img id="player-avatar" src="" alt="jugador">
          </div>
          <p id="player-name"></p>
        </div>
        <div class="row-2">
          <div class="stats" id="stat-attack">
            <p></p>
          </div>
          <div class="stats" id="stat-defense">
            <p></p>
          </div>
          <div class="stats" id="stat-health">
            <p></p>
          </div>
          <div class="stats" id="stat-points">
            <p></p>
          </div>
        </div>
        <div class="row-3">
          <button id="buttonContinue">Continuar</button>
        </div>
      </div>
    </div>

    <!-- ESCENA 2: MERCADO -->
     <div id="scene-2" class="scene">
      <div id="scene-2-container">
        <div class="row-1">
          <div id="card-container">
            <div class="card" id="card-1"></div>
            <div class="card" id="card-2"></div>
            <div class="card" id="card-3"></div>
            <div class="card" id="card-4"></div>
            <div class="card" id="card-5"></div>
            <div class="card" id="card-6"></div>
            <div class="card" id="card-7"></div>
            <div class="card" id="card-8"></div>
          </div>
        </div>
        <div class="row-2">
          <button>Continuar</button>
        </div>
      </div>
    </div>

    <!-- ESCENA 3: JUGADOR ACTUALIZADO-->
    <div id="scene-3" class="scene">
      <div id="scene-3-container">
        <div class="row-1">
          <div class="img-container">
            <img id="player-avatar-3" src="" alt="jugador">
          </div>
          <p id="player-name-3"></p>
        </div>
        <div class="row-2">
          <div class="stats" id="stat-attack-3">
            <p></p>
          </div>
          <div class="stats" id="stat-defense-3">
            <p></p>
          </div>
          <div class="stats" id="stat-health-3">
            <p></p>
          </div>
          <div class="stats" id="stat-points-3">
            <p></p>
          </div>
        </div>
        <div class="row-3">
          <button id="buttonContinue-3">Continuar</button>
        </div>
      </div>
    </div>

    <!-- ESCENA 4: ENEMIGOS -->
    <div id="enemies" class="scene">
      <div id="enemies-container">
      </div>
      <button>Continuar</button>
    </div>

    <!-- ESCENA 5: BATALLA -->
    <div id="battle" class="scene">
      <div id="battle-container">
      </div>
      <button>Continuar</button>
    </div>

    <!-- ESCENA 6: RANKING -->
    <div id="ranking" class="scene">
      <div id="ranking-container">
      </div>
      <button>Continuar</button>
    </div>

  </main>
</body>

</html>
